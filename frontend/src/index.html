  <meta name="theme-color" content="#0b1220">
  <script>
    // Színtéma: midnight (Midnight Blue + Teal), ivory (Ivory + Forest Green), champagne (Charcoal + Champagne).
    // Az alapértelmezett a <html data-theme> értéke; előnézethez: ?tema=ivory
    (function () {
      var themes = { midnight: '#0b1220', ivory: '#f7f5ef', champagne: '#17191c' };
      var root = document.documentElement;
      var asked = new URLSearchParams(location.search).get('tema');
      if (asked && themes[asked]) root.setAttribute('data-theme', asked);
      var meta = document.querySelector('meta[name=theme-color]');
      if (meta) meta.setAttribute('content', themes[root.getAttribute('data-theme')] || themes.midnight);
    })();
  </script>
